<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Login Website</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background-color: #f4f4f9; }
        .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; max-width: 350px; width: 100%; }
        button { background-color: #4285F4; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 15px; }
        button:hover { background-color: #357ae8; }
        #logoutBtn { background-color: #d93025; }
        #logoutBtn:hover { background-color: #b8251b; }
        .profile-img { border-radius: 50%; width: 70px; height: 70px; margin-top: 15px; border: 3px solid #4285F4; }
    </style>
</head>
<body>

    <div class="card">
        <h2>My GitHub Website</h2>
        <p id="statusMsg">Please sign in to view your profile.</p>
        
        <!-- Auth Buttons -->
        <button id="loginBtn">Sign in with Google</button>
        <button id="logoutBtn" style="display:none;">Sign Out</button>
        
        <!-- Profile Container -->
        <div id="userProfile" style="margin-top:20px;"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://gstatic.com";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://gstatic.com";

        // ⚠️ PASTE YOUR ACTUAL CONFIGURATION KEYS HERE
        const firebaseConfig = {
            apiKey: "AIzaSyBkyDE2GmFOI9OAhNx8pER3Heh4daeVdB8",
            authDomain: "test-f1406.firebaseapp.com",
            projectId: "test-f1406",
            storageBucket: "test-f1406.firebasestorage.app",
            messagingSenderId: "630847859570",
            appId: "1:630847859570:web:44e7f3f09d5f3a4a300beb"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        const loginBtn = document.getElementById('loginBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const userProfile = document.getElementById('userProfile');
        const statusMsg = document.getElementById('statusMsg');

        loginBtn.addEventListener('click', () => {
            signInWithPopup(auth, provider)
                .then((result) => {
                    console.log("Success!", result.user);
                }).catch((error) => {
                    alert("Login failed: " + error.message);
                });
        });

        logoutBtn.addEventListener('click', () => {
            signOut(auth).then(() => {
                userProfile.innerHTML = "";
            });
        });

        onAuthStateChanged(auth, (user) => {
            if (user) {
                loginBtn.style.display = 'none';
                logoutBtn.style.display = 'inline-block';
                statusMsg.textContent = "Welcome back!";
                userProfile.innerHTML = `
                    <img src="${user.photoURL}" class="profile-img" alt="Profile Picture">
                    <h3>Hello, ${user.displayName}!</h3>
                    <p style="color: #666; font-size: 14px;">${user.email}</p>
                `;
            } else {
                loginBtn.style.display = 'inline-block';
                logoutBtn.style.display = 'none';
                statusMsg.textContent = "Please sign in to view your profile.";
                userProfile.innerHTML = "";
            }
        });
    </script>
</body>
</html>
