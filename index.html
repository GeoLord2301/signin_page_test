<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Login Website</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background-color: #f4f4f9; }
        .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; max-width: 350px; width: 100%; }
        .login-btn { display: inline-block; background-color: #4285F4; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 4px; text-decoration: none; font-weight: bold; margin-top: 15px; }
        .login-btn:hover { background-color: #357ae8; }
        .logout-btn { background-color: #d93025; color: white; border: none; padding: 10px 20px; font-size: 14px; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 15px; display: none; }
        .profile-img { border-radius: 50%; width: 70px; height: 70px; margin-top: 15px; border: 3px solid #4285F4; }
    </style>
</head>
<body>

    <div class="card">
        <h2>My GitHub Website</h2>
        <p id="statusMsg">Please sign in to view your profile.</p>
        
        <!-- Native pure link connection -->
        <a id="loginBtn" class="login-btn" href="#">Sign in with Google</a>
        <button id="logoutBtn" class="logout-btn" onclick="logout()">Sign Out</button>
        
        <div id="userProfile" style="margin-top:20px;"></div>
    </div>

    <script>
        // 1. PASTE YOUR COPIED GOOGLE CLIENT ID KEY INSIDE THE QUOTES
        const CLIENT_ID = "481435116900-j182qnaogiofd90p16fbhihovnvtnn65.apps.googleusercontent.com"; 
        const REDIRECT_URI = "https://github.io";

        // 2. Generate standard clean URL request query path
        const googleAuthUrl = `https://google.com?` +
            `client_id=${CLIENT_ID}&` +
            `redirect_uri=${encodeURIComponent(REDIRECT_URI)}&` +
            `response_type=token&` +
            `scope=${encodeURIComponent('https://googleapis.com https://googleapis.com')}&` +
            `include_granted_scopes=true&` +
            `state=pass-through-value`;

        document.getElementById("loginBtn").href = googleAuthUrl;

        // 3. Process returning credentials from the address bar hash parameters
        window.onload = function() {
            const hash = window.location.hash;
            if (hash) {
                const params = new URLSearchParams(hash.substring(1));
                const accessToken = params.get("access_token");

                if (accessToken) {
                    fetch(`https://googleapis.com{accessToken}`)
                        .then(response => response.json())
                        .then(user => {
                            document.getElementById('loginBtn').style.display = 'none';
                            document.getElementById('logoutBtn').style.display = 'inline-block';
                            document.getElementById('statusMsg').textContent = "Welcome back!";
                            document.getElementById('userProfile').innerHTML = `
                                <img src="${user.picture}" class="profile-img" alt="Profile Picture">
                                <h3>Hello, ${user.name}!</h3>
                                <p style="color: #666; font-size: 14px;">${user.email}</p>
                            `;
                            window.history.replaceState({}, document.title, window.location.pathname);
                        })
                        .catch(err => alert("Data extraction issue: " + err.message));
                }
            }
        };

        function logout() {
            document.getElementById('loginBtn').style.display = 'inline-block';
            document.getElementById('logoutBtn').style.display = 'none';
            document.getElementById('userProfile').innerHTML = "";
            document.getElementById('statusMsg').textContent = "Please sign in to view your profile.";
        }
    </script>
</body>
</html>
